name: Central AI Blog Agent

on:
  workflow_call:
    inputs:
      target_repo:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      trigger_sha:
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  generate_blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AI Agent Repo
        uses: actions/checkout@v4
        with:
          repository: Gaurav0807/ai-blog-agents
          path: ai-agent

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target-repo
          fetch-depth: 0 # Clone whole repository history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai-agent
        run: pip install -r requirements.txt

      - name: Debug Info
        run: |
          echo "Repo: ${{ inputs.target_repo }}"
          echo "Branch: ${{ inputs.target_branch }}"
          echo "Trigger SHA: ${{ inputs.trigger_sha }}"

      - name: Run AI Agent
        working-directory: ai-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
        run: python agent.py ../target-repo

      # - name: Commit blog to target repo path
      #   run: |
      #     cd target-repo
      #     git config user.name "Gaurav0807"
      #     git config user.email "gauravrawat141999@gmail.com"
      #     git add medium_blog.md
      #     git commit -m "docs(ai): auto-generate for medium blog" || echo "No changes"
      #     git push
      
      - name: Commit blog to target repo path
        run: |
          cd target-repo

          git config user.name "Gaurav0807"
          git config user.email "gauravrawat141999@gmail.com"

          git add medium_blog.md

          # Only commit if there are real changes
          if ! git diff --cached --quiet; then
            git commit -m "docs(ai): auto-generate for medium blog"
            git push
          else
            echo "No changes to commit"
          fi
      
      - name: Validate blog generated
        run: |
          test -f target-repo/medium_blog.md || (echo "Blog not generated" && exit 1)

